# Schedule: 0 10,14 * * *   (2x per day at 10:00 / 14:00 UTC = 18:00 / 22:00 UTC+8)
# V2: Two runs cover 20:00-24:00 local time window for 2-3 messages per day
name: cron-daily-proactive

on:
  schedule:
    - cron: '0 10,14 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # maxDuration=120 on the route, allow buffer
    steps:
      - name: Call /api/cron/daily-proactive
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::APP_URL secret is not set"
            exit 1
          fi
          curl -fsS -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: github-actions/cron-daily-proactive" \
            "${APP_URL}/api/cron/daily-proactive" \
            -w '\nHTTP=%{http_code} TIME=%{time_total}s\n' \
            || (echo "::error::cron request failed"; exit 1)