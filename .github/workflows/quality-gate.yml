# Quality gate — hard block on lint warnings, type errors, failing tests and
# incomplete i18n. Runs on every push/PR to main; merge is blocked on failure.
name: quality-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (zero warnings)
        run: pnpm lint

      - name: Type check (with route typegen)
        run: |
          pnpm run typegen
          pnpm tsc --noEmit

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: i18n completeness
        run: pnpm i18n:check
