name: Build RunPod ComfyUI SDXL Pro

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - runpod/comfyui-worker/Dockerfile.sdxl-pro
      - runpod/comfyui-worker/start-sdxl-pro.sh
      - .github/workflows/build-runpod-comfyui-sdxl-pro.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/soulmate-comfyui-sdxl-pro
  IMAGE_TAG: latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish linux/amd64 worker image
        uses: docker/build-push-action@v6
        with:
          context: runpod/comfyui-worker
          file: runpod/comfyui-worker/Dockerfile.sdxl-pro
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
