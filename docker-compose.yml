version: '3.8'

# ============================================================================
# SoulMate AI - Local Development Environment
# ============================================================================
# Features:
#   - Supabase (PostgreSQL + Auth) local mock
#   - Next.js dev server with Turbopack
#   - Redis cache for rate limiting
#   - MinIO S3-compatible storage
#   - Auto-reload on code changes
# 
# Usage:
#   docker compose up -d              # Start all services
#   docker compose logs -f nextjs     # View app logs
#   docker compose down               # Stop everything
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # PostgreSQL Database (Supabase-compatible schema)
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: sm9_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sm9_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - soulmate-network

  # --------------------------------------------------------------------------
  # Supabase Auth & Edge Functions Mock
  # --------------------------------------------------------------------------
  supabase-auth-mock:
    build:
      context: ./infra/docker/supabase-mock
      dockerfile: Dockerfile
    container_name: sm9_supabase_mock
    environment:
      SUPABASE_URL: http://localhost:8000
      JWT_SECRET: test-jwt-secret-for-local-dev-only
      POSTGRES_URL: postgresql://postgres:postgres@postgres:5432/sm9_dev
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    networks:
      - soulmate-network

  # --------------------------------------------------------------------------
  # Redis Cache (for rate limiting & sessions)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sm9_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - soulmate-network

  # --------------------------------------------------------------------------
  # MinIO S3-Compatible Storage (for images/media)
  # --------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: sm9_minio
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - minio_data:/minio_data
    command: server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - soulmate-network

  # --------------------------------------------------------------------------
  # Next.js Dev Server (with Turbopack)
  # --------------------------------------------------------------------------
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        NODE_ENV: development
    container_name: sm9_nextjs
    env_file:
      - .env.local
    environment:
      # Database connections
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sm9_dev
      
      # Supabase Auth
      - NEXT_PUBLIC_SUPABASE_URL=http://localhost:8000
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=test-anon-key
      
      # COZE Proxy (service role)
      - COZE_SUPABASE_URL=http://supabase-mock:8000
      - COZE_SUPABASE_SERVICE_ROLE_KEY=test-service-role-key
      
      # Redis connection
      - UPSTASH_REDIS_URL=http://redis:6379
      
      # MinIO storage
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password123
      - MINIO_ENDPOINT=localhost:9000
      
      # Feature flags
      - CONTENT_MODE=sfw
      - ENABLE_TELEMETRY=false
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    stdin_open: true
    tty: true
    command: ["pnpm", "dev", "-H", "0.0.0.0"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - soulmate-network

  # --------------------------------------------------------------------------
  # PgAdmin (optional DB management UI)
  # --------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sm9_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@soulmate.ai
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - soulmate-network

networks:
  soulmate-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  pgadmin_data:
