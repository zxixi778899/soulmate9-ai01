  <path d="M84 76 L118 84" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.45"/>
  <path d="M428 76 L394 84" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.45"/>
</svg>